name: Deploy

on:
  push:
    branches: [main]
  # 예약 발행 글을 반영하려면 주기적으로 다시 빌드해야 한다 (frontmatter date 기준, UTC)
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v4
        env:
          # Set the PUBLIC_GA_ID repository variable to switch Google Analytics on
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
