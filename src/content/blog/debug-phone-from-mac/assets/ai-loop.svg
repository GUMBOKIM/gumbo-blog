<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 226" role="img" aria-label="AI가 실기기에서 검증하는 흐름. 1. 상태 만들기: localStorage에 목 세션과 MSW 시나리오를 넣고 새로고침한다. 2. 조작: 버튼 클릭, 입력, 화면 이동을 명령어로 한다. 3. 확인: DOM의 글자와 요소 크기를 읽는다. 안드로이드 키보드는 dumpsys input_method로 확인하고, 아이폰 키보드는 AI가 알림을 보내면 사람이 확인한다. 4. 판정: 통과하면 끝, 틀리면 AI가 코드를 고치고 다시 빌드해 설치한 뒤 처음부터 다시 한다." font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <!-- steps -->
  <g fill="#2b3139" stroke="#444c56">
    <rect x="14" y="20" width="172" height="128" rx="12"/>
    <rect x="206" y="20" width="172" height="128" rx="12"/>
    <rect x="398" y="20" width="172" height="128" rx="12"/>
    <rect x="590" y="20" width="164" height="128" rx="12"/>
  </g>
  <g font-size="11" font-weight="700" fill="#56d3a3">
    <text x="30" y="44">1</text>
    <text x="222" y="44">2</text>
    <text x="414" y="44">3</text>
    <text x="606" y="44">4</text>
  </g>
  <g font-size="14" font-weight="700" fill="#c9d1d9">
    <text x="44" y="44">상태 만들기</text>
    <text x="236" y="44">조작</text>
    <text x="428" y="44">확인</text>
    <text x="620" y="44">판정</text>
  </g>

  <g font-size="11" fill="#c9d1d9">
    <text x="30" y="72">localStorage에</text>
    <text x="30" y="90">목 세션 + MSW 시나리오</text>
    <text x="30" y="108">넣고 새로고침</text>
    <text x="30" y="134" fill="#8b949e" font-size="10">로그인·실데이터 필요 없음</text>

    <text x="222" y="72">버튼 클릭</text>
    <text x="222" y="90">입력창 포커스·입력</text>
    <text x="222" y="108">화면 이동</text>
    <text x="222" y="134" fill="#8b949e" font-size="10">모두 명령어로</text>

    <text x="414" y="72">DOM 글자 · 요소 크기</text>
    <text x="414" y="94" fill="#8b949e" font-size="10">키보드가 올라왔나</text>
    <text x="414" y="112" font-size="10">안드로이드: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dumpsys</tspan></text>
    <text x="414" y="128" font-size="10">아이폰: 알림 → 사람이 확인</text>

    <text x="606" y="74"><tspan fill="#56d3a3" font-weight="700">✓</tspan> 통과하면 끝</text>
    <text x="606" y="100"><tspan fill="#e879b0" font-weight="700">✗</tspan> 틀리면</text>
    <text x="620" y="118">코드를 고치고</text>
    <text x="620" y="134">다시 빌드·설치</text>
  </g>

  <!-- arrows between steps -->
  <g stroke="#8b949e" stroke-width="1.6">
    <path d="M186,84 H198"/>
    <path d="M378,84 H390"/>
    <path d="M570,84 H582"/>
  </g>
  <g fill="#8b949e">
    <path d="M205,84 l-7,-4 v8 z"/>
    <path d="M397,84 l-7,-4 v8 z"/>
    <path d="M589,84 l-7,-4 v8 z"/>
  </g>

  <!-- retry -->
  <path d="M672,148 C672,206 100,206 100,156" stroke="#e879b0" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
  <path d="M100,149 l-5,9 h10 z" fill="#e879b0"/>
  <text x="386" y="214" font-size="11" fill="#e879b0" text-anchor="middle">AI가 혼자 다시 돈다</text>
</svg>
