<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 258" role="img" aria-label="How commands are sent. On Android (CDP), a Runtime.evaluate command sent as is just runs. On iPhone (WebKit Inspector, iOS 12.2+), sending Runtime.evaluate as is fails with 'Runtime' domain was not found. It has to be wrapped as a string inside Target.sendMessageToTarget along with the targetId received earlier, and the result comes back as a string inside Target.dispatchMessageFromTarget." font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <!-- Android column -->
  <text x="14" y="24" font-size="13" font-weight="700" fill="#58a6ff">Android · CDP</text>
  <rect x="14" y="40" width="300" height="70" rx="10" fill="#30363d" stroke="#444c56"/>
  <g font-size="11" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="30" y="68">{ method: "Runtime.evaluate",</text>
    <text x="30" y="88">  params: { expression } }</text>
  </g>
  <path d="M164,110 V130" stroke="#8b949e" stroke-width="1.6"/>
  <path d="M164,137 l-4,-7 h8 z" fill="#8b949e"/>
  <text x="164" y="158" font-size="12" text-anchor="middle"><tspan fill="#56d3a3" font-weight="700">✓</tspan><tspan fill="#c9d1d9"> Sent as is, it just runs</tspan></text>

  <!-- divider -->
  <path d="M342,14 V244" stroke="#444c56" stroke-dasharray="4 4"/>

  <!-- iPhone column -->
  <text x="370" y="24" font-size="13" font-weight="700" fill="#d29922">iPhone · WebKit Inspector (iOS 12.2+)</text>

  <!-- naive attempt -->
  <rect x="370" y="40" width="160" height="30" rx="8" fill="#30363d" stroke="#e879b0" stroke-dasharray="4 3"/>
  <text x="450" y="60" font-size="11" fill="#c9d1d9" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Runtime.evaluate</text>
  <text x="542" y="53" font-size="12"><tspan fill="#e879b0" font-weight="700">✗</tspan><tspan fill="#c9d1d9"> Sent as is</tspan></text>
  <text x="542" y="68" font-size="10" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">'Runtime' domain was not found</text>

  <!-- envelope -->
  <rect x="370" y="88" width="384" height="112" rx="10" fill="#2b3139" stroke="#56d3a3"/>
  <g font-size="11" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="386" y="110" fill="#56d3a3" font-weight="700">Target.sendMessageToTarget</text>
    <text x="386" y="130">targetId: "page-1"</text>
    <text x="386" y="152">message:</text>
  </g>
  <rect x="452" y="140" width="286" height="46" rx="8" fill="#30363d" stroke="#444c56"/>
  <g font-size="11" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="466" y="160">"{ method: \"Runtime.evaluate\",</text>
    <text x="466" y="176">   params: { expression } }"</text>
  </g>
  <text x="610" y="110" font-size="10" fill="#8b949e">← envelope</text>
  <text x="738" y="130" font-size="10" fill="#8b949e" text-anchor="end">↓ the real command, as a string</text>

  <!-- result -->
  <path d="M562,200 V218" stroke="#8b949e" stroke-width="1.6"/>
  <path d="M562,225 l-4,-7 h8 z" fill="#8b949e"/>
  <text x="562" y="245" font-size="12" text-anchor="middle"><tspan fill="#56d3a3" font-weight="700">✓</tspan><tspan fill="#c9d1d9"> Result comes back in </tspan><tspan fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">dispatchMessageFromTarget</tspan><tspan fill="#c9d1d9"></tspan></text>
</svg>
