<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 340" role="img" aria-label="휴대폰 화면을 확인하는 다섯 가지 방법과 한계. 1. 데스크톱 모바일 보기: 화면 크기는 흉내 내지만 엔진이 다르고 키보드·노치가 없고 앱 코드가 돌지 않는다. 2. 시뮬레이터·에뮬레이터: 진짜 엔진에서 앱이 그대로 돌지만 키보드가 실기기와 다를 수 있다. 3. 스크린샷 보기: 실기기 화면 그대로지만 찍고 읽느라 너무 느리고, 좌표를 짐작해서 조작이 부정확하고, 실제 크기를 잴 수 없다. 4. 인스펙터 창(chrome://inspect, Safari): 실기기에 붙지만 사람이 창을 조작해야 해서 AI가 명령어로 다룰 수 없다. 5. 실기기와 명령어: 실기기 그대로 AI가 직접 조작하고 측정한다. 아이폰은 스크립트를 직접 만들어야 하고, 아이폰 키보드는 사람이 확인한다." font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <!-- columns -->
  <g fill="#2b3139" stroke="#444c56">
    <rect x="11" y="14" width="142" height="312" rx="12"/>
    <rect x="162" y="14" width="142" height="312" rx="12"/>
    <rect x="313" y="14" width="142" height="312" rx="12"/>
    <rect x="464" y="14" width="142" height="312" rx="12"/>
    <rect x="615" y="14" width="142" height="312" rx="12" stroke="#56d3a3" stroke-width="1.6"/>
  </g>

  <!-- labels -->
  <g font-size="11" font-weight="700" text-anchor="middle" fill="#8b949e">
    <text x="82" y="36">대안 1</text>
    <text x="233" y="36">대안 2</text>
    <text x="384" y="36">대안 3</text>
    <text x="535" y="36">대안 4</text>
    <text x="686" y="36" fill="#56d3a3">결국 이것</text>
  </g>

  <!-- titles -->
  <g font-size="13" font-weight="700" fill="#c9d1d9" text-anchor="middle">
    <text x="82" y="58">모바일 보기</text>
    <text x="233" y="58">시뮬레이터</text>
    <text x="384" y="58">스크린샷 보기</text>
    <text x="535" y="58">인스펙터 창</text>
    <text x="686" y="58" fill="#56d3a3">실기기 + 명령어</text>
  </g>
  <g font-size="10" fill="#8b949e" text-anchor="middle">
    <text x="82" y="76">데스크톱 Chrome</text>
    <text x="233" y="76">Xcode · Android Studio</text>
    <text x="384" y="76">직접 써 본 방식</text>
    <text x="535" y="76">chrome://inspect · Safari</text>
    <text x="686" y="76">adb · WebKit 프록시</text>
  </g>

  <!-- dividers -->
  <g stroke="#444c56">
    <path d="M23,90 H141"/>
    <path d="M174,90 H292"/>
    <path d="M325,90 H443"/>
    <path d="M476,90 H594"/>
    <path d="M627,90 H745"/>
  </g>

  <!-- what works -->
  <g font-size="11.5" fill="#c9d1d9">
    <text x="23" y="114"><tspan fill="#56d3a3" font-weight="700">✓</tspan></text>
    <text x="38" y="114">화면 크기 흉내</text>

    <text x="174" y="114"><tspan fill="#56d3a3" font-weight="700">✓</tspan></text>
    <text x="189" y="114">진짜 엔진,</text>
    <text x="189" y="130">앱 그대로</text>

    <text x="325" y="114"><tspan fill="#56d3a3" font-weight="700">✓</tspan></text>
    <text x="340" y="114">실기기 화면</text>
    <text x="340" y="130">그대로</text>

    <text x="476" y="114"><tspan fill="#56d3a3" font-weight="700">✓</tspan></text>
    <text x="491" y="114">실기기에 붙음</text>

    <text x="627" y="114"><tspan fill="#56d3a3" font-weight="700">✓</tspan></text>
    <text x="642" y="114">실기기 그대로</text>
    <text x="627" y="138"><tspan fill="#56d3a3" font-weight="700">✓</tspan></text>
    <text x="642" y="138">AI가 직접</text>
    <text x="642" y="154">조작·측정</text>
  </g>

  <!-- limit labels -->
  <g font-size="10" fill="#8b949e">
    <text x="23" y="190">한계</text>
    <text x="174" y="190">한계</text>
    <text x="325" y="190">한계</text>
    <text x="476" y="190">한계</text>
    <text x="627" y="190">남는 것</text>
  </g>

  <!-- limits -->
  <g font-size="11.5" fill="#c9d1d9">
    <!-- 1 -->
    <text x="23" y="212" fill="#e879b0" font-weight="700">✗</text>
    <text x="38" y="212">엔진이 다름</text>
    <text x="38" y="227" font-size="10" fill="#8b949e">아이폰은 WebKit</text>
    <text x="23" y="250" fill="#e879b0" font-weight="700">✗</text>
    <text x="38" y="250">키보드·노치 없음</text>
    <text x="23" y="272" fill="#e879b0" font-weight="700">✗</text>
    <text x="38" y="272">앱 코드가 안 돎</text>

    <!-- 2 -->
    <text x="174" y="212" fill="#e879b0" font-weight="700">✗</text>
    <text x="189" y="212">키보드가 실기기와</text>
    <text x="189" y="228">다를 수 있음</text>

    <!-- 3 -->
    <text x="325" y="212" fill="#e879b0" font-weight="700">✗</text>
    <text x="340" y="212">너무 느림</text>
    <text x="340" y="227" font-size="10" fill="#8b949e">찍고, 읽고, 또 찍고</text>
    <text x="325" y="250" fill="#e879b0" font-weight="700">✗</text>
    <text x="340" y="250">좌표를 짐작해서</text>
    <text x="340" y="266">조작이 부정확</text>
    <text x="325" y="290" fill="#e879b0" font-weight="700">✗</text>
    <text x="340" y="290">실제 크기를</text>
    <text x="340" y="306">잴 수 없음</text>

    <!-- 4 -->
    <text x="476" y="212" fill="#e879b0" font-weight="700">✗</text>
    <text x="491" y="212">사람이 창을 조작</text>
    <text x="476" y="234" fill="#e879b0" font-weight="700">✗</text>
    <text x="491" y="234">AI가 명령어로</text>
    <text x="491" y="250">다룰 수 없음</text>

    <!-- 5 -->
    <text x="627" y="212" fill="#d29922" font-weight="700">△</text>
    <text x="642" y="212">아이폰은</text>
    <text x="642" y="228">스크립트를 직접 만듦</text>
    <text x="627" y="252" fill="#d29922" font-weight="700">△</text>
    <text x="642" y="252">아이폰 키보드는</text>
    <text x="642" y="268">사람이 확인</text>
  </g>
</svg>
