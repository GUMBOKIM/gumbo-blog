<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 262" role="img" aria-label="Two paths from the Mac to a phone's WebView. Android: the AI attaches with playwright's connectOverCDP to port 9333 on the Mac, and adb forward connects that port over USB to the WebView's debug socket on the phone. The protocol is CDP. iPhone: the AI attaches with a homemade script, iphone-eval.mjs, to port 9222 on the Mac, and ios_webkit_debug_proxy connects it over USB to the iPhone's WebView. The protocol is the WebKit Inspector protocol." font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <!-- the Mac -->
  <rect x="8" y="8" width="510" height="246" rx="14" fill="none" stroke="#444c56" stroke-dasharray="5 4"/>
  <text x="24" y="30" font-size="11" font-weight="700" fill="#8b949e">Mac</text>

  <!-- AI -->
  <rect x="24" y="78" width="92" height="106" rx="12" fill="#2b3139" stroke="#56d3a3"/>
  <text x="70" y="128" font-size="15" font-weight="700" fill="#56d3a3" text-anchor="middle">AI</text>
  <text x="70" y="148" font-size="10" fill="#8b949e" text-anchor="middle">Claude Code</text>

  <!-- AI to clients -->
  <g stroke="#8b949e" stroke-width="1.6" fill="none">
    <path d="M116,120 C128,120 128,76 140,76"/>
    <path d="M116,142 C128,142 128,186 140,186"/>
  </g>
  <g fill="#8b949e">
    <path d="M146,76 l-7,-4 v8 z"/>
    <path d="M146,186 l-7,-4 v8 z"/>
  </g>

  <!-- row labels -->
  <g font-size="11" font-weight="700">
    <text x="146" y="40" fill="#c9d1d9">Android</text>
    <text x="146" y="150" fill="#c9d1d9">iPhone</text>
  </g>

  <!-- clients -->
  <g fill="#30363d" stroke="#444c56">
    <rect x="146" y="50" width="160" height="52" rx="10"/>
    <rect x="146" y="160" width="160" height="52" rx="10"/>
  </g>
  <g font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">
    <text x="226" y="72">playwright</text>
    <text x="226" y="182">iphone-eval.mjs</text>
  </g>
  <g font-size="10" fill="#8b949e" text-anchor="middle">
    <text x="226" y="90">connectOverCDP</text>
    <text x="226" y="200">homemade script</text>
  </g>

  <!-- clients to bridges -->
  <g stroke="#8b949e" stroke-width="1.6">
    <path d="M306,76 H324"/>
    <path d="M306,186 H324"/>
  </g>
  <g fill="#8b949e">
    <path d="M330,76 l-7,-4 v8 z"/>
    <path d="M330,186 l-7,-4 v8 z"/>
  </g>

  <!-- bridges -->
  <g fill="#30363d" stroke="#444c56">
    <rect x="330" y="50" width="172" height="52" rx="10"/>
    <rect x="330" y="160" width="172" height="52" rx="10"/>
  </g>
  <g font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">
    <text x="416" y="72">adb forward</text>
    <text x="416" y="182">ios_webkit_debug_proxy</text>
  </g>
  <g font-size="10" fill="#8b949e" text-anchor="middle">
    <text x="416" y="90">Mac :9333 ↔ WebView socket</text>
    <text x="416" y="200">exposes USB on :9222</text>
  </g>

  <!-- USB -->
  <g stroke="#8b949e" stroke-width="2.4">
    <path d="M502,76 H582"/>
    <path d="M502,186 H582"/>
  </g>
  <g font-size="10" fill="#8b949e" text-anchor="middle">
    <text x="542" y="68">USB</text>
    <text x="542" y="178">USB</text>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="542" y="92" fill="#58a6ff">CDP</text>
    <text x="542" y="202" fill="#d29922">WebKit</text>
    <text x="542" y="215" fill="#d29922">Inspector</text>
  </g>

  <!-- phones -->
  <g fill="#2b3139" stroke="#c9d1d9" stroke-width="1.4">
    <rect x="582" y="22" width="170" height="108" rx="16"/>
    <rect x="582" y="132" width="170" height="108" rx="16"/>
  </g>
  <g fill="#30363d" stroke="#58a6ff">
    <rect x="596" y="52" width="142" height="48" rx="8"/>
  </g>
  <g fill="#30363d" stroke="#d29922">
    <rect x="596" y="162" width="142" height="48" rx="8"/>
  </g>
  <g font-size="10" fill="#8b949e" text-anchor="middle">
    <text x="667" y="42">Android phone</text>
    <text x="667" y="152">iPhone</text>
  </g>
  <g font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">
    <text x="667" y="74">Android WebView</text>
    <text x="667" y="184">WKWebView</text>
  </g>
  <g font-size="10" fill="#8b949e" text-anchor="middle">
    <text x="667" y="90">App or Chrome tab</text>
    <text x="667" y="200">App or Safari tab</text>
  </g>
</svg>
