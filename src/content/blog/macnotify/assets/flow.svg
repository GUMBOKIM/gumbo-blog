<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 236" role="img" aria-label="MacNotify 동작 흐름: Claude Code, Slack, 카톡 같은 앱이 알림을 보내면 macOS 알림 데몬 usernoted가 배너를 띄우고 Presenting 로그를 한 줄 남긴다. MacNotify는 log stream으로 이 줄을 감시하다가 줄에 든 앱의 bundle id로 진동 패턴을 고르고 이벤트를 보낸다. Logi Plugin Service가 이벤트를 진동 패턴으로 바꾸고, MX Master 4의 햅틱 센스 패널이 진동한다. 로그를 못 읽으면 예비로 알림 센터 DB를 1초마다 확인하는데, 약 5초 늦고 전체 디스크 접근 권한이 필요하다. 방해 금지 모드에서는 배너가 뜨지 않아 로그도 없으니 진동하지 않는다." font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <!-- the log line usernoted writes when a banner is shown -->
  <rect x="196" y="6" width="372" height="24" rx="6" fill="#1d3a31" stroke="#56d3a3"/>
  <text x="382" y="22" font-size="10" fill="#c9d1d9" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Presenting &lt;NotificationRecord app:"com.tinyspeck.slackmacgap"</text>
  <path d="M230,44 V30" stroke="#56d3a3" stroke-width="1.6" fill="none"/>
  <path d="M382,30 V38" stroke="#56d3a3" stroke-width="1.6" fill="none"/>
  <path d="M382,44 l-4,-7 h8 z" fill="#56d3a3"/>

  <!-- the main path -->
  <g fill="#2b3139" stroke="#444c56">
    <rect x="14" y="44" width="128" height="76" rx="10"/>
    <rect x="166" y="44" width="128" height="76" rx="10"/>
    <rect x="470" y="44" width="128" height="76" rx="10"/>
    <rect x="622" y="44" width="128" height="76" rx="10"/>
  </g>
  <rect x="318" y="44" width="128" height="76" rx="10" fill="#2b3139" stroke="#56d3a3"/>

  <g font-size="13" font-weight="700" text-anchor="middle" fill="#c9d1d9">
    <text x="78" y="72">앱</text>
    <text x="230" y="72">usernoted</text>
    <text x="382" y="72" fill="#56d3a3">MacNotify</text>
    <text x="534" y="72" font-size="12">Logi Plugin Service</text>
    <text x="686" y="72">MX Master 4</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#8b949e">
    <text x="78" y="92">Claude Code · Slack</text>
    <text x="78" y="108">카톡 · 캘린더</text>
    <text x="230" y="92">macOS 알림 데몬</text>
    <text x="230" y="108">배너 띄우고 로그 남김</text>
    <text x="382" y="92">log stream으로 감시</text>
    <text x="382" y="108">앱별로 패턴 고름</text>
    <text x="534" y="92">notif_knock 이벤트를</text>
    <text x="534" y="108">knock 진동으로</text>
    <text x="686" y="92">햅틱 센스 패널</text>
    <text x="686" y="108">진동</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.6" fill="none">
    <path d="M142,82 H160"/>
    <path d="M446,82 H464"/>
    <path d="M598,82 H616"/>
  </g>
  <g fill="#8b949e">
    <path d="M166,82 l-7,-4 v8 z"/>
    <path d="M470,82 l-7,-4 v8 z"/>
    <path d="M622,82 l-7,-4 v8 z"/>
  </g>

  <!-- fallback: Notification Center database -->
  <path d="M230,120 V158" stroke="#8b949e" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
  <path d="M230,164 l-4,-7 h8 z" fill="#8b949e"/>
  <text x="238" y="145" font-size="10" fill="#8b949e">늦게 기록됨</text>
  <rect x="166" y="164" width="128" height="60" rx="10" fill="none" stroke="#444c56" stroke-dasharray="4 3"/>
  <text x="230" y="188" font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">알림 센터 DB</text>
  <text x="230" y="206" font-size="10" fill="#8b949e" text-anchor="middle">로그 실패 시 · 약 5초 늦음</text>
  <text x="230" y="219" font-size="10" fill="#8b949e" text-anchor="middle">전체 디스크 접근 필요</text>
  <path d="M294,194 H382 V126" stroke="#8b949e" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
  <path d="M382,120 l-4,7 h8 z" fill="#8b949e"/>
  <text x="302" y="186" font-size="10" fill="#8b949e">1초마다 확인</text>

  <!-- focus mode note -->
  <rect x="470" y="162" width="280" height="64" rx="10" fill="none" stroke="#444c56"/>
  <text x="484" y="184" font-size="12" font-weight="700" fill="#c9d1d9">방해 금지 모드일 때</text>
  <text x="484" y="202" font-size="11" fill="#8b949e">배너가 안 뜨면 Presenting 로그도 없으니</text>
  <text x="484" y="217" font-size="11" fill="#8b949e">따로 처리하지 않아도 진동하지 않는다</text>
</svg>
