<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 250" role="img" aria-label="레이어 순서 비교. 순서 바꾸기 전: 베이스 이미지 위에 dist, 그 위에 node_modules. dist가 매번 바뀌니 그 위의 node_modules까지 다시 만든다. 순서 바꾼 후: 베이스 이미지 위에 node_modules, 그 위에 dist. 의존성이 같으면 node_modules는 재사용하고 dist만 다시 만든다." font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <!-- Before -->
  <text x="14" y="24" font-size="13" font-weight="700" fill="#f85149">순서 바꾸기 전</text>
  <text x="340" y="24" font-size="12" text-anchor="end" fill="#8b949e">코드만 바꿔도 node_modules까지 새로</text>

  <rect x="14" y="40" width="326" height="52" rx="8" fill="#3d1f1f" stroke="#f85149"/>
  <text x="30" y="62" font-size="13" font-weight="700" fill="#c9d1d9">③ node_modules</text>
  <text x="30" y="80" font-size="11" fill="#8b949e">가장 큼 · 안 바뀌었는데도 다시 만듦</text>
  <text x="324" y="71" font-size="12" text-anchor="end" fill="#f85149">다시 만듦</text>

  <rect x="14" y="100" width="326" height="52" rx="8" fill="#3d1f1f" stroke="#f85149"/>
  <text x="30" y="122" font-size="13" font-weight="700" fill="#c9d1d9">② dist</text>
  <text x="30" y="140" font-size="11" fill="#8b949e">작지만 매번 바뀜</text>
  <text x="324" y="131" font-size="12" text-anchor="end" fill="#f85149">다시 만듦</text>

  <rect x="14" y="160" width="326" height="52" rx="8" fill="#30363d" stroke="#444c56"/>
  <text x="30" y="182" font-size="13" font-weight="700" fill="#c9d1d9">① 베이스 이미지</text>
  <text x="30" y="200" font-size="11" fill="#8b949e">FROM · 여러 레이어</text>
  <text x="324" y="191" font-size="12" text-anchor="end" fill="#56d3a3">재사용</text>

  <!-- divider -->
  <path d="M384,14 V236" stroke="#444c56" stroke-dasharray="4 4"/>

  <!-- After -->
  <text x="428" y="24" font-size="13" font-weight="700" fill="#56d3a3">순서 바꾼 후</text>
  <text x="754" y="24" font-size="12" text-anchor="end" fill="#8b949e">의존성이 같으면 dist만 새로</text>

  <rect x="428" y="40" width="326" height="52" rx="8" fill="#3d1f1f" stroke="#f85149"/>
  <text x="444" y="62" font-size="13" font-weight="700" fill="#c9d1d9">③ dist</text>
  <text x="444" y="80" font-size="11" fill="#8b949e">작지만 매번 바뀜</text>
  <text x="738" y="71" font-size="12" text-anchor="end" fill="#f85149">다시 만듦</text>

  <rect x="428" y="100" width="326" height="52" rx="8" fill="#30363d" stroke="#444c56"/>
  <text x="444" y="122" font-size="13" font-weight="700" fill="#c9d1d9">② node_modules</text>
  <text x="444" y="140" font-size="11" fill="#8b949e">가장 큼 · 그대로 둠</text>
  <text x="738" y="131" font-size="12" text-anchor="end" fill="#56d3a3">재사용</text>

  <rect x="428" y="160" width="326" height="52" rx="8" fill="#30363d" stroke="#444c56"/>
  <text x="444" y="182" font-size="13" font-weight="700" fill="#c9d1d9">① 베이스 이미지</text>
  <text x="444" y="200" font-size="11" fill="#8b949e">FROM · 여러 레이어</text>
  <text x="738" y="191" font-size="12" text-anchor="end" fill="#56d3a3">재사용</text>

  <text x="384" y="238" font-size="12" text-anchor="middle" fill="#8b949e">아래부터 위로 쌓임 · 한 레이어가 바뀌면 그 위는 전부 다시 만든다</text>
</svg>
