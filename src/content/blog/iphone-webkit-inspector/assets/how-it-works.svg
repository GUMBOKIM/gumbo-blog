<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 250" role="img" aria-label="플러그인 구조. 맥 안에서 Claude Code가 ios.mjs 명령을 실행하고, ios.mjs 데몬이 탭별 연결을 유지하며 콘솔과 네트워크 이벤트를 기록한다. 데몬은 Unix 소켓으로 CDP를 보내고, pymobiledevice3 브릿지가 이를 WebKit 인스펙터 프로토콜로 번역해 USB 또는 Wi-Fi로 아이폰의 Safari·Chrome 탭에 전달한다. 화면 전체 스크린샷과 FPS는 Xcode 개발자 서비스로 따로 가져온다." font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <!-- the Mac -->
  <rect x="8" y="8" width="572" height="234" rx="14" fill="none" stroke="#444c56" stroke-dasharray="5 4"/>
  <text x="24" y="30" font-size="11" font-weight="700" fill="#8b949e">맥</text>

  <!-- Claude Code -->
  <rect x="24" y="60" width="96" height="78" rx="12" fill="#2b3139" stroke="#56d3a3"/>
  <text x="72" y="96" font-size="13" font-weight="700" fill="#56d3a3" text-anchor="middle">Claude Code</text>
  <text x="72" y="114" font-size="10" fill="#8b949e" text-anchor="middle">명령 실행</text>

  <!-- daemon -->
  <rect x="146" y="52" width="150" height="94" rx="10" fill="#30363d" stroke="#444c56"/>
  <text x="221" y="78" font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">ios.mjs (CLI·데몬)</text>
  <g font-size="10" fill="#8b949e" text-anchor="middle">
    <text x="221" y="98">탭별 연결 유지</text>
    <text x="221" y="114">콘솔·네트워크 기록</text>
    <text x="221" y="130">의존성 없는 Node</text>
  </g>

  <!-- bridge -->
  <rect x="346" y="52" width="160" height="94" rx="10" fill="#30363d" stroke="#444c56"/>
  <text x="426" y="78" font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">pymobiledevice3</text>
  <g font-size="10" fill="#8b949e" text-anchor="middle">
    <text x="426" y="98">CDP → WebKit 번역</text>
    <text x="426" y="114">uvx로 격리 실행</text>
  </g>

  <!-- developer services -->
  <rect x="346" y="168" width="160" height="58" rx="10" fill="#30363d" stroke="#444c56"/>
  <text x="426" y="192" font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">Xcode 개발자 서비스</text>
  <text x="426" y="210" font-size="10" fill="#8b949e" text-anchor="middle">화면 전체 스크린샷·FPS</text>

  <!-- arrows -->
  <g stroke="#8b949e" stroke-width="1.6" fill="none">
    <path d="M120,99 H140"/>
    <path d="M296,99 H340"/>
    <path d="M221,146 V197 H340"/>
  </g>
  <g fill="#8b949e">
    <path d="M146,99 l-7,-4 v8 z"/>
    <path d="M346,99 l-7,-4 v8 z"/>
    <path d="M346,197 l-7,-4 v8 z"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="321" y="91" fill="#58a6ff">CDP</text>
    <text x="321" y="115" fill="#8b949e">Unix 소켓</text>
  </g>

  <!-- links to the phone -->
  <g stroke="#8b949e" stroke-width="2.4">
    <path d="M506,99 H602"/>
    <path d="M506,197 H602"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="554" y="90" fill="#8b949e">USB · Wi-Fi</text>
    <text x="554" y="114" fill="#d29922">WebKit</text>
    <text x="554" y="127" fill="#d29922">인스펙터</text>
    <text x="554" y="188" fill="#8b949e">CoreDevice</text>
  </g>

  <!-- the iPhone -->
  <rect x="602" y="22" width="150" height="214" rx="18" fill="#2b3139" stroke="#c9d1d9" stroke-width="1.4"/>
  <text x="677" y="42" font-size="10" fill="#8b949e" text-anchor="middle">아이폰</text>
  <rect x="614" y="62" width="126" height="74" rx="8" fill="#30363d" stroke="#d29922"/>
  <text x="677" y="94" font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">Safari·Chrome</text>
  <text x="677" y="112" font-size="10" fill="#8b949e" text-anchor="middle">지금 열린 탭</text>
  <rect x="614" y="172" width="126" height="50" rx="8" fill="#30363d" stroke="#444c56"/>
  <text x="677" y="194" font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">화면 전체</text>
  <text x="677" y="210" font-size="10" fill="#8b949e" text-anchor="middle">주소창·키보드 포함</text>
</svg>
