<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 250" role="img" aria-label="How the plugin is put together. On the Mac, Claude Code runs ios.mjs commands. The ios.mjs daemon keeps one connection per tab and records console and network events. It sends CDP over a Unix socket to the pymobiledevice3 bridge, which translates it to the WebKit Inspector protocol and passes it over USB or Wi-Fi to the Safari or Chrome tab on the iPhone. Whole-screen screenshots and FPS come separately from Xcode developer services." font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <!-- the Mac -->
  <rect x="8" y="8" width="572" height="234" rx="14" fill="none" stroke="#444c56" stroke-dasharray="5 4"/>
  <text x="24" y="30" font-size="11" font-weight="700" fill="#8b949e">Mac</text>

  <!-- Claude Code -->
  <rect x="24" y="60" width="96" height="78" rx="12" fill="#2b3139" stroke="#56d3a3"/>
  <text x="72" y="96" font-size="13" font-weight="700" fill="#56d3a3" text-anchor="middle">Claude Code</text>
  <text x="72" y="114" font-size="10" fill="#8b949e" text-anchor="middle">runs commands</text>

  <!-- daemon -->
  <rect x="146" y="52" width="150" height="94" rx="10" fill="#30363d" stroke="#444c56"/>
  <text x="221" y="78" font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">ios.mjs (CLI, daemon)</text>
  <g font-size="10" fill="#8b949e" text-anchor="middle">
    <text x="221" y="98">one connection per tab</text>
    <text x="221" y="114">records console, network</text>
    <text x="221" y="130">plain Node, no deps</text>
  </g>

  <!-- bridge -->
  <rect x="346" y="52" width="160" height="94" rx="10" fill="#30363d" stroke="#444c56"/>
  <text x="426" y="78" font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">pymobiledevice3</text>
  <g font-size="10" fill="#8b949e" text-anchor="middle">
    <text x="426" y="98">translates CDP → WebKit</text>
    <text x="426" y="114">isolated via uvx</text>
  </g>

  <!-- developer services -->
  <rect x="346" y="168" width="160" height="58" rx="10" fill="#30363d" stroke="#444c56"/>
  <text x="426" y="192" font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">Xcode dev services</text>
  <text x="426" y="210" font-size="10" fill="#8b949e" text-anchor="middle">full-screen shots, FPS</text>

  <!-- arrows -->
  <g stroke="#8b949e" stroke-width="1.6" fill="none">
    <path d="M120,99 H140"/>
    <path d="M296,99 H340"/>
    <path d="M221,146 V197 H340"/>
  </g>
  <g fill="#8b949e">
    <path d="M146,99 l-7,-4 v8 z"/>
    <path d="M346,99 l-7,-4 v8 z"/>
    <path d="M346,197 l-7,-4 v8 z"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="321" y="91" fill="#58a6ff">CDP</text>
    <text x="321" y="115" fill="#8b949e">Unix socket</text>
  </g>

  <!-- links to the phone -->
  <g stroke="#8b949e" stroke-width="2.4">
    <path d="M506,99 H602"/>
    <path d="M506,197 H602"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="554" y="90" fill="#8b949e">USB · Wi-Fi</text>
    <text x="554" y="114" fill="#d29922">WebKit</text>
    <text x="554" y="127" fill="#d29922">Inspector</text>
    <text x="554" y="188" fill="#8b949e">CoreDevice</text>
  </g>

  <!-- the iPhone -->
  <rect x="602" y="22" width="150" height="214" rx="18" fill="#2b3139" stroke="#c9d1d9" stroke-width="1.4"/>
  <text x="677" y="42" font-size="10" fill="#8b949e" text-anchor="middle">iPhone</text>
  <rect x="614" y="62" width="126" height="74" rx="8" fill="#30363d" stroke="#d29922"/>
  <text x="677" y="94" font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">Safari·Chrome</text>
  <text x="677" y="112" font-size="10" fill="#8b949e" text-anchor="middle">the open tab</text>
  <rect x="614" y="172" width="126" height="50" rx="8" fill="#30363d" stroke="#444c56"/>
  <text x="677" y="194" font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">whole screen</text>
  <text x="677" y="210" font-size="10" fill="#8b949e" text-anchor="middle">with Safari bars, keyboard</text>
</svg>
