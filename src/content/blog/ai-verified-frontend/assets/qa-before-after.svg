<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 236" role="img" aria-label="QA가 상황을 확인하는 방식, 전과 후. 전: QA가 쿠폰이 없으면 어떻게 보이는지 묻고, 개발자가 데이터나 핸들러를 고치고, 화면 공유나 스크린샷으로 보여 준 뒤에야 QA가 확인한다. 다른 상황이면 처음부터 다시. 후: QA, 디자이너, PM이 패널에서 클릭하거나 받은 링크를 열어, 개발자 없이 빈 상태, 에러, 느린 응답, 오프라인을 바로 확인한다." font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <g font-size="13" font-weight="700" fill="#8b949e" text-anchor="middle">
    <text x="26" y="65">전</text>
    <text x="26" y="175">후</text>
  </g>

  <!-- before: every situation goes through a developer -->
  <g fill="#2b3139" stroke="#444c56">
    <rect x="50" y="32" width="150" height="56" rx="10"/>
    <rect x="236" y="32" width="150" height="56" rx="10" stroke="#e879b0"/>
    <rect x="422" y="32" width="150" height="56" rx="10"/>
    <rect x="608" y="32" width="146" height="56" rx="10"/>
  </g>
  <g font-size="13" font-weight="700" fill="#c9d1d9" text-anchor="middle">
    <text x="125" y="56">QA</text>
    <text x="311" y="56">개발자</text>
    <text x="497" y="56">보여 주기</text>
    <text x="681" y="56">QA 확인</text>
  </g>
  <g font-size="11" fill="#8b949e" text-anchor="middle">
    <text x="125" y="75">"쿠폰이 없으면요?"</text>
    <text x="311" y="75">데이터 · 핸들러 수정</text>
    <text x="497" y="75">화면 공유 · 스크린샷</text>
    <text x="681" y="75">그 상황 하나만</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.6" fill="none">
    <path d="M200,60 H230"/>
    <path d="M386,60 H416"/>
    <path d="M572,60 H602"/>
  </g>
  <g fill="#8b949e">
    <path d="M236,60 l-7,-4 v8 z"/>
    <path d="M422,60 l-7,-4 v8 z"/>
    <path d="M608,60 l-7,-4 v8 z"/>
  </g>
  <path d="M681,88 V106 H125 V96" stroke="#e879b0" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
  <path d="M125,88 l-5,9 h10 z" fill="#e879b0"/>
  <text x="403" y="122" font-size="11" fill="#e879b0" text-anchor="middle">다른 상황이면 처음부터 다시</text>

  <!-- after: open it yourself -->
  <g fill="#2b3139" stroke="#56d3a3">
    <rect x="50" y="142" width="150" height="56" rx="10"/>
    <rect x="236" y="142" width="150" height="56" rx="10"/>
    <rect x="422" y="142" width="332" height="56" rx="10"/>
  </g>
  <g font-size="13" font-weight="700" fill="#c9d1d9" text-anchor="middle">
    <text x="125" y="166">QA · 디자이너 · PM</text>
    <text x="311" y="166">패널 또는 링크</text>
    <text x="588" y="166">바로 확인</text>
  </g>
  <g font-size="11" fill="#8b949e" text-anchor="middle">
    <text x="125" y="185">직접 고른다</text>
    <text x="311" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">?cue=getCoupons:Empty</text>
    <text x="588" y="185">빈 상태 · 에러 · 느린 응답 · 오프라인</text>
  </g>
  <g stroke="#56d3a3" stroke-width="1.6" fill="none">
    <path d="M200,170 H230"/>
    <path d="M386,170 H416"/>
  </g>
  <g fill="#56d3a3">
    <path d="M236,170 l-7,-4 v8 z"/>
    <path d="M422,170 l-7,-4 v8 z"/>
  </g>
  <text x="403" y="224" font-size="12" font-weight="700" fill="#56d3a3" text-anchor="middle">준비된 상황은 개발자 없이 확인</text>
</svg>
