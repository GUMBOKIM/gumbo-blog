<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 236" role="img" aria-label="How QA checks a situation, before and after. Before: QA asks what the screen looks like with no coupons, a developer edits data or handlers, shows it over a screen share or screenshot, and only then QA checks it. Another situation means starting over. After: QA, designers, and PMs click in the panel or open a link they were sent, and check the empty state, errors, slow responses, and offline right away without a developer." font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <g font-size="11" font-weight="700" fill="#8b949e" text-anchor="middle">
    <text x="26" y="65">Before</text>
    <text x="26" y="175">After</text>
  </g>

  <!-- before: every situation goes through a developer -->
  <g fill="#2b3139" stroke="#444c56">
    <rect x="50" y="32" width="150" height="56" rx="10"/>
    <rect x="236" y="32" width="150" height="56" rx="10" stroke="#e879b0"/>
    <rect x="422" y="32" width="150" height="56" rx="10"/>
    <rect x="608" y="32" width="146" height="56" rx="10"/>
  </g>
  <g font-size="13" font-weight="700" fill="#c9d1d9" text-anchor="middle">
    <text x="125" y="56">QA</text>
    <text x="311" y="56">Developer</text>
    <text x="497" y="56">Shows it</text>
    <text x="681" y="56">QA checks</text>
  </g>
  <g font-size="11" fill="#8b949e" text-anchor="middle">
    <text x="125" y="75">"What if there are none?"</text>
    <text x="311" y="75">Edits data · handlers</text>
    <text x="497" y="75">Screen share · screenshot</text>
    <text x="681" y="75">Just that one</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.6" fill="none">
    <path d="M200,60 H230"/>
    <path d="M386,60 H416"/>
    <path d="M572,60 H602"/>
  </g>
  <g fill="#8b949e">
    <path d="M236,60 l-7,-4 v8 z"/>
    <path d="M422,60 l-7,-4 v8 z"/>
    <path d="M608,60 l-7,-4 v8 z"/>
  </g>
  <path d="M681,88 V106 H125 V96" stroke="#e879b0" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
  <path d="M125,88 l-5,9 h10 z" fill="#e879b0"/>
  <text x="403" y="122" font-size="11" fill="#e879b0" text-anchor="middle">Another situation? Start over</text>

  <!-- after: open it yourself -->
  <g fill="#2b3139" stroke="#56d3a3">
    <rect x="50" y="142" width="150" height="56" rx="10"/>
    <rect x="236" y="142" width="150" height="56" rx="10"/>
    <rect x="422" y="142" width="332" height="56" rx="10"/>
  </g>
  <g font-size="13" font-weight="700" fill="#c9d1d9" text-anchor="middle">
    <text x="125" y="166">QA · Designer · PM</text>
    <text x="311" y="166">Panel or link</text>
    <text x="588" y="166">Check right away</text>
  </g>
  <g font-size="11" fill="#8b949e" text-anchor="middle">
    <text x="125" y="185">Pick it themselves</text>
    <text x="311" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">?cue=getCoupons:Empty</text>
    <text x="588" y="185">Empty · error · slow · offline</text>
  </g>
  <g stroke="#56d3a3" stroke-width="1.6" fill="none">
    <path d="M200,170 H230"/>
    <path d="M386,170 H416"/>
  </g>
  <g fill="#56d3a3">
    <path d="M236,170 l-7,-4 v8 z"/>
    <path d="M422,170 l-7,-4 v8 z"/>
  </g>
  <text x="403" y="224" font-size="12" font-weight="700" fill="#56d3a3" text-anchor="middle">The situations are ready. No developer needed.</text>
</svg>
