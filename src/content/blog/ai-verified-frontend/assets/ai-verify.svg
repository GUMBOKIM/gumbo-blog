<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 284" role="img" aria-label="AI 검증 루프: AI는 요구사항과 확인할 링크를 받고, AGENTS.md에서 링크 문법을 읽는다. 브라우저 도구(Playwright MCP, Chrome DevTools MCP)로 링크를 열어 화면을 읽는다. Empty 링크는 빈 상태 문구가 나와 통과. Many 링크는 첫 화면에 유효 쿠폰만 있고 더보기 버튼이 있어 통과. 더보기를 누른 뒤 만료 쿠폰이 맨 뒤가 아니라 중간에 섞여 있으면 실패. 실패하면 AI가 코드를 고치고 다시 연다." font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <!-- where the link syntax comes from -->
  <rect x="14" y="16" width="160" height="40" rx="8" fill="#30363d" stroke="#444c56"/>
  <text x="94" y="34" font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">AGENTS.md</text>
  <text x="94" y="49" font-size="10" fill="#8b949e" text-anchor="middle">링크 문법을 알려 줌</text>
  <path d="M94,56 V74" stroke="#8b949e" stroke-width="1.6"/>
  <path d="M94,80 l-4,-7 h8 z" fill="#8b949e"/>

  <!-- the agent -->
  <rect x="14" y="80" width="160" height="100" rx="12" fill="#2b3139" stroke="#56d3a3"/>
  <text x="94" y="108" font-size="15" font-weight="700" fill="#56d3a3" text-anchor="middle">AI</text>
  <g font-size="11" fill="#c9d1d9" text-anchor="middle">
    <text x="94" y="134">요구사항</text>
    <text x="94" y="152">+ 확인할 링크</text>
  </g>

  <!-- browser tools -->
  <path d="M174,130 H190" stroke="#8b949e" stroke-width="1.6"/>
  <path d="M196,130 l-7,-4 v8 z" fill="#8b949e"/>
  <rect x="196" y="98" width="128" height="64" rx="10" fill="#30363d" stroke="#444c56"/>
  <text x="260" y="121" font-size="12" font-weight="700" fill="#c9d1d9" text-anchor="middle">브라우저 도구</text>
  <text x="260" y="139" font-size="10" fill="#8b949e" text-anchor="middle">Playwright MCP</text>
  <text x="260" y="153" font-size="10" fill="#8b949e" text-anchor="middle">Chrome DevTools MCP</text>

  <!-- the tool opens two links -->
  <g stroke="#8b949e" stroke-width="1.6" fill="none">
    <path d="M324,130 C340,130 340,58 354,58"/>
    <path d="M324,130 C340,130 340,138 354,138"/>
  </g>
  <g fill="#8b949e">
    <path d="M360,58 l-7,-4 v8 z"/>
    <path d="M360,138 l-7,-4 v8 z"/>
  </g>

  <!-- small browser windows -->
  <g fill="#2b3139" stroke="#444c56">
    <rect x="360" y="26" width="240" height="64" rx="8"/>
    <rect x="360" y="106" width="240" height="64" rx="8"/>
    <rect x="360" y="202" width="240" height="64" rx="8" stroke="#e879b0"/>
  </g>
  <g fill="#30363d">
    <rect x="368" y="33" width="224" height="18" rx="4"/>
    <rect x="368" y="113" width="224" height="18" rx="4"/>
    <rect x="368" y="209" width="224" height="18" rx="4"/>
  </g>
  <g font-size="10" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="376" y="46">/?cue=getCoupons:Empty</text>
    <text x="376" y="126">/?cue=getCoupons:Many</text>
    <text x="376" y="222">/?cue=getCoupons:Many</text>
  </g>
  <g font-size="12" fill="#c9d1d9" text-anchor="middle">
    <text x="480" y="75">쿠폰이 없습니다</text>
    <text x="480" y="155">유효 쿠폰만 · [더보기]</text>
    <text x="480" y="251">11 만료 · 12 유효 · 13 만료</text>
  </g>

  <!-- the next step on the same page -->
  <path d="M480,170 V195" stroke="#8b949e" stroke-width="1.6"/>
  <path d="M480,202 l-4,-7 h8 z" fill="#8b949e"/>
  <text x="490" y="190" font-size="10" fill="#8b949e">더보기 클릭</text>

  <!-- what the AI concluded -->
  <text x="616" y="18" font-size="10" fill="#8b949e">AI의 확인 결과</text>
  <g font-size="12">
    <text x="616" y="62" fill="#56d3a3" font-weight="700">✓</text>
    <text x="634" y="62" fill="#c9d1d9">빈 상태 문구</text>
    <text x="616" y="142" fill="#56d3a3" font-weight="700">✓</text>
    <text x="634" y="142" fill="#c9d1d9">첫 화면에</text>
    <text x="634" y="158" fill="#c9d1d9">만료 쿠폰 없음</text>
    <text x="616" y="231" fill="#e879b0" font-weight="700">✗</text>
    <text x="634" y="231" fill="#c9d1d9">만료 쿠폰이</text>
    <text x="634" y="247" fill="#c9d1d9">맨 뒤가 아님</text>
  </g>

  <!-- a failure goes back to the AI -->
  <path d="M420,266 C420,284 94,284 94,190" stroke="#e879b0" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
  <path d="M94,182 l-5,9 h10 z" fill="#e879b0"/>
  <text x="230" y="238" font-size="11" fill="#e879b0" text-anchor="middle">틀리면 고치고 다시 연다</text>
</svg>
